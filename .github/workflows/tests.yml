name: Tests

on: [push, pull_request]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu runtime and test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-numpy python3-pil python3-pyqt6 python3-pytest ffmpeg
      - name: Test correction, GUI, and real codec round trips
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python3 -m pytest -q
