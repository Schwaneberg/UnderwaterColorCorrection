[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uwcc"
version = "0.1.0"
description = "Local underwater video color correction"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["numpy>=1.26", "Pillow>=10", "PySide6>=6.6"]

[project.optional-dependencies]
ml = ["onnxruntime>=1.17"]
vision = ["opencv-python-headless>=4.10"]
test = ["pytest>=8"]

[project.scripts]
uwcc = "uwcc.__main__:main"

[tool.setuptools.packages.find]
include = ["uwcc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
